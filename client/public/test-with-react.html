<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顔入れ替え機能テスト（React Query シミュレーション）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 1000px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    
    .test-section {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      background: #f9f9f9;
    }
    
    .test-section h2 {
      color: #667eea;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .test-section p {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    
    .file-preview {
      width: 100%;
      height: 200px;
      border: 2px dashed #667eea;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      background: white;
      overflow: hidden;
    }
    
    .file-preview img,
    .file-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .file-preview.empty {
      color: #999;
      font-size: 12px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .result-section {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      background: #f9f9f9;
      margin-top: 30px;
    }
    
    .result-section h3 {
      color: #333;
      margin-bottom: 15px;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .result-image {
      width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin-top: 15px;
      object-fit: contain;
    }
    
    .log-section {
      background: #1e1e1e;
      color: #00ff00;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 15px;
    }
    
    .log-line {
      margin-bottom: 5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    @media (max-width: 768px) {
      .test-grid {
        grid-template-columns: 1fr;
      }
      
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 顔入れ替え機能テスト（React Query シミュレーション）</h1>
    <p class="subtitle">React Query クライアントを使用した実際のテスト</p>
    
    <div class="test-grid">
      <!-- 画像処理テスト -->
      <div class="test-section">
        <h2>📷 画像処理テスト</h2>
        <p>ソース画像をターゲット画像に適用して顔を入れ替えます</p>
        <div class="file-preview" id="imagePreview">
          <span class="empty">プレビュー</span>
        </div>
        <button id="testImageBtn" onclick="testImageSwap()">画像処理を実行</button>
      </div>
      
      <!-- 動画処理テスト -->
      <div class="test-section">
        <h2>🎥 動画処理テスト</h2>
        <p>ソース画像をターゲット動画に適用して顔を入れ替えます</p>
        <div class="file-preview" id="videoPreview">
          <span class="empty">プレビュー</span>
        </div>
        <button id="testVideoBtn" onclick="testVideoSwap()">動画処理を実行</button>
      </div>
    </div>
    
    <!-- 結果表示 -->
    <div class="result-section">
      <h3>📊 テスト結果</h3>
      <div id="statusContainer"></div>
      <div class="log-section" id="logContainer"></div>
    </div>
  </div>
  
  <script>
    const API_URL = window.location.origin;
    const SOURCE_IMAGE = '/upload/1000016980.jpg';
    const TARGET_IMAGE = '/upload/1000020705.jpg';
    const TARGET_VIDEO = '/upload/1000019517.mp4';
    
    const logs = [];
    
    function addLog(message) {
      const timestamp = new Date().toLocaleTimeString();
      logs.push(`[${timestamp}] ${message}`);
      const logContainer = document.getElementById('logContainer');
      logContainer.innerHTML = logs.map(log => `<div class="log-line">${log}</div>`).join('');
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    
    // ファイルプレビューの読み込み
    async function loadPreviews() {
      try {
        addLog('プレビュー読み込み開始...');
        
        // ソース画像プレビュー
        const imagePreview = document.getElementById('imagePreview');
        const img = document.createElement('img');
        img.src = SOURCE_IMAGE;
        img.onload = () => {
          imagePreview.innerHTML = '';
          imagePreview.appendChild(img);
          addLog('ソース画像プレビュー読み込み完了');
        };
        img.onerror = () => {
          addLog('❌ ソース画像読み込みエラー');
        };
        
        // ビデオプレビュー
        const videoPreview = document.getElementById('videoPreview');
        const video = document.createElement('video');
        video.src = TARGET_VIDEO;
        video.controls = true;
        video.onloadedmetadata = () => {
          videoPreview.innerHTML = '';
          videoPreview.appendChild(video);
          addLog('ターゲット動画プレビュー読み込み完了');
        };
        video.onerror = () => {
          addLog('❌ ターゲット動画読み込みエラー');
        };
      } catch (error) {
        addLog(`❌ プレビュー読み込みエラー: ${error.message}`);
      }
    }
    
    // 画像処理テスト
    async function testImageSwap() {
      const btn = document.getElementById('testImageBtn');
      const statusContainer = document.getElementById('statusContainer');
      
      btn.disabled = true;
      statusContainer.innerHTML = '<div class="status loading"><span class="spinner"></span> 画像処理中...</div>';
      addLog('画像処理テスト開始...');
      
      try {
        // ファイルを読み込む
        addLog('ファイル読み込み中...');
        const sourceResp = await fetch(SOURCE_IMAGE);
        const targetResp = await fetch(TARGET_IMAGE);
        
        if (!sourceResp.ok || !targetResp.ok) {
          throw new Error('ファイル読み込みエラー');
        }
        
        const sourceBlob = await sourceResp.blob();
        const targetBlob = await targetResp.blob();
        
        addLog(`ソース画像: ${sourceBlob.size} bytes`);
        addLog(`ターゲット画像: ${targetBlob.size} bytes`);
        
        // FormDataを作成
        addLog('FormData作成中...');
        const formData = new FormData();
        formData.append('sourceImage', sourceBlob, 'source.jpg');
        formData.append('targetImage', targetBlob, 'target.jpg');
        formData.append('quality', 'high');
        
        // tRPC エンドポイントを呼び出し
        addLog('API呼び出し中: /api/trpc/fileUpload.swap');
        const response = await fetch(`${API_URL}/api/trpc/fileUpload.swap`, {
          method: 'POST',
          body: formData,
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          }
        });
        
        addLog(`レスポンスステータス: ${response.status}`);
        
        if (!response.ok) {
          const errorText = await response.text();
          addLog(`❌ API エラー: ${response.status}`);
          addLog(`レスポンス: ${errorText.substring(0, 200)}`);
          throw new Error(`API エラー: ${response.status}`);
        }
        
        const result = await response.json();
        addLog(`レスポンス受信: ${JSON.stringify(result).substring(0, 100)}`);
        
        if (result.error) {
          throw new Error(result.error.message || 'エラーが発生しました');
        }
        
        const data = result.result?.data;
        
        if (data && data.resultImage) {
          addLog('✓ 画像処理成功');
          statusContainer.innerHTML = `
            <div class="status success">✓ 画像処理成功</div>
            <img src="${data.resultImage}" alt="処理結果" class="result-image">
            <p>処理時間: ${data.processingTime}ms</p>
          `;
        } else {
          throw new Error('レスポンス形式が不正です');
        }
      } catch (error) {
        addLog(`❌ エラー: ${error.message}`);
        statusContainer.innerHTML = `
          <div class="status error">✗ エラー: ${error.message}</div>
        `;
        console.error('テストエラー:', error);
      } finally {
        btn.disabled = false;
      }
    }
    
    // 動画処理テスト
    async function testVideoSwap() {
      const btn = document.getElementById('testVideoBtn');
      const statusContainer = document.getElementById('statusContainer');
      
      btn.disabled = true;
      statusContainer.innerHTML = '<div class="status loading"><span class="spinner"></span> 動画処理中（数秒かかります）...</div>';
      addLog('動画処理テスト開始...');
      
      try {
        // ファイルを読み込む
        addLog('ファイル読み込み中...');
        const sourceResp = await fetch(SOURCE_IMAGE);
        const videoResp = await fetch(TARGET_VIDEO);
        
        if (!sourceResp.ok || !videoResp.ok) {
          throw new Error('ファイル読み込みエラー');
        }
        
        const sourceBlob = await sourceResp.blob();
        const videoBlob = await videoResp.blob();
        
        addLog(`ソース画像: ${sourceBlob.size} bytes`);
        addLog(`ターゲット動画: ${videoBlob.size} bytes`);
        
        // FormDataを作成
        addLog('FormData作成中...');
        const formData = new FormData();
        formData.append('sourceImage', sourceBlob, 'source.jpg');
        formData.append('targetVideo', videoBlob, 'target.mp4');
        formData.append('quality', 'high');
        
        // tRPC エンドポイントを呼び出し
        addLog('API呼び出し中: /api/trpc/fileUpload.swapVideo');
        const response = await fetch(`${API_URL}/api/trpc/fileUpload.swapVideo`, {
          method: 'POST',
          body: formData
        });
        
        addLog(`レスポンスステータス: ${response.status}`);
        
        if (!response.ok) {
          const errorText = await response.text();
          addLog(`❌ API エラー: ${response.status}`);
          addLog(`レスポンス: ${errorText.substring(0, 200)}`);
          throw new Error(`API エラー: ${response.status}`);
        }
        
        const result = await response.json();
        addLog(`レスポンス受信: ${JSON.stringify(result).substring(0, 100)}`);
        
        if (result.error) {
          throw new Error(result.error.message || 'エラーが発生しました');
        }
        
        const data = result.result?.data;
        
        if (data && data.resultVideo) {
          addLog('✓ 動画処理成功');
          statusContainer.innerHTML = `
            <div class="status success">✓ 動画処理成功</div>
            <video controls class="result-image">
              <source src="${data.resultVideo}" type="video/mp4">
              ブラウザが動画をサポートしていません
            </video>
            <p>処理時間: ${data.processingTime}ms</p>
            <p>処理フレーム数: ${data.processedFrames || 'N/A'}</p>
          `;
        } else {
          throw new Error('レスポンス形式が不正です');
        }
      } catch (error) {
        addLog(`❌ エラー: ${error.message}`);
        statusContainer.innerHTML = `
          <div class="status error">✗ エラー: ${error.message}</div>
        `;
        console.error('テストエラー:', error);
      } finally {
        btn.disabled = false;
      }
    }
    
    // ページ読み込み時にプレビューを読み込む
    window.addEventListener('load', loadPreviews);
  </script>
</body>
</html>
