# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line. Check Gradle settings in the IDE if Gradle behaves unexpectedly.

# When configured, Gradle will run in offline mode and will not check for
# updates when building your project.
# org.gradle.offline=true

# AndroidX package structure to make it unambiguous which package your item is
# intended to utilize. The property is not necessary if you are using the
# Gradle plugin 3.1.0 or later.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Version of gradle to use
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Gradle parallel build
org.gradle.parallel=true

# Enable daemon
org.gradle.daemon=true

# Build cache
org.gradle.caching=true

# Gradle build features
android.defaults.buildFeatures.buildConfig=true
android.defaults.buildFeatures.aidl=false
android.defaults.buildFeatures.renderScript=false
android.defaults.buildFeatures.resValues=false
android.defaults.buildFeatures.shaders=false

# R8/ProGuard
android.enableR8=true
android.enableProguardInReleaseBuilds=true

# Kotlin
kotlin.code.style=official

# NDK
android.ndkVersion=25.1.8937393

# SDK versions
android.compileSdkVersion=34
android.targetSdkVersion=34
android.minSdkVersion=21
android.buildToolsVersion=34.0.0
