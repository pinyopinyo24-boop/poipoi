<!DOCTYPE html>
<html>
<head>
  <title>Face Swap Browser Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      margin-bottom: 30px;
      text-align: center;
    }
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .test-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .test-card h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .preview {
      width: 100%;
      height: 200px;
      background: #f0f0f0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .preview img, .preview video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .result-section h2 {
      color: #333;
      margin-bottom: 15px;
    }
    .status {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
    }
    .status.success {
      background: #e8f5e9;
      color: #388e3c;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
    .result-image, .result-video {
      width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin: 15px 0;
    }
    .info {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 14px;
      color: #666;
    }
    .download-btn {
      background: #4caf50;
      margin-top: 10px;
    }
    .download-btn:hover { background: #45a049; }
    @media (max-width: 768px) {
      .test-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 顔入れ替え機能テスト</h1>
    
    <div class="test-grid">
      <div class="test-card">
        <h2>📸 ソース画像</h2>
        <div class="preview" id="sourcePreview">
          <span>画像を読み込み中...</span>
        </div>
        <div class="info">ファイル: 1000016980.jpg</div>
      </div>
      
      <div class="test-card">
        <h2>🎥 ターゲット動画</h2>
        <div class="preview" id="targetPreview">
          <span>動画を読み込み中...</span>
        </div>
        <div class="info">ファイル: 1000019517.mp4</div>
      </div>
    </div>
    
    <div class="test-grid">
      <div class="test-card">
        <h2>🔄 画像処理テスト</h2>
        <button onclick="testImageSwap()" id="imageBtn">画像処理を実行</button>
        <div class="info">ソース画像をターゲット画像に適用</div>
      </div>
      
      <div class="test-card">
        <h2>🎬 動画処理テスト</h2>
        <button onclick="testVideoSwap()" id="videoBtn">動画処理を実行</button>
        <div class="info">ソース画像をターゲット動画に適用</div>
      </div>
    </div>
    
    <div class="result-section">
      <h2>📊 テスト結果</h2>
      <div id="results"></div>
    </div>
  </div>

  <script>
    // ファイルを読み込む
    async function loadFiles() {
      try {
        // ソース画像を読み込む
        const sourceRes = await fetch('/upload/1000016980.jpg');
        const sourceBlob = await sourceRes.blob();
        const sourceUrl = URL.createObjectURL(sourceBlob);
        document.getElementById('sourcePreview').innerHTML = 
          `<img src="${sourceUrl}" alt="Source">`;
        
        // ターゲット動画を読み込む
        const targetRes = await fetch('/upload/1000019517.mp4');
        const targetBlob = await targetRes.blob();
        const targetUrl = URL.createObjectURL(targetBlob);
        document.getElementById('targetPreview').innerHTML = 
          `<video src="${targetUrl}" controls style="width:100%; height:100%;"></video>`;
      } catch (error) {
        console.error('ファイル読み込みエラー:', error);
      }
    }

    async function testImageSwap() {
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('imageBtn');
      
      btn.disabled = true;
      resultsDiv.innerHTML = '<div class="status loading">⏳ 画像処理中...</div>';
      
      try {
        // ファイルを読み込む
        const sourceRes = await fetch('/upload/1000016980.jpg');
        const targetRes = await fetch('/upload/1000016980.jpg');
        
        const sourceBlob = await sourceRes.blob();
        const targetBlob = await targetRes.blob();
        
        const sourceBase64 = await blobToBase64(sourceBlob);
        const targetBase64 = await blobToBase64(targetBlob);
        
        const startTime = Date.now();
        
        // tRPC クライアントを使用
        const response = await fetch('/api/trpc/fileUpload.swap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            "0": {
              "json": {
                "sourceImage": sourceBase64,
                "targetImage": targetBase64,
                "quality": "medium"
              }
            }
          })
        });
        
        const data = await response.json();
        const processingTime = Date.now() - startTime;
        
        if (response.ok && data.result && data.result[0]?.data) {
          const result = data.result[0].data;
          
          if (result.success && result.resultImage) {
            const resultUrl = `data:image/jpeg;base64,${result.resultImage}`;
            resultsDiv.innerHTML = `
              <div class="status success">✅ 画像処理成功！</div>
              <div class="info">
                <strong>処理時間:</strong> ${result.processingTime}ms<br>
                <strong>API 応答時間:</strong> ${processingTime}ms<br>
                <strong>結果画像サイズ:</strong> ${(result.resultImage.length / 1024).toFixed(2)}KB
              </div>
              <img src="${resultUrl}" alt="Result" class="result-image">
              <button class="download-btn" onclick="downloadImage('${resultUrl}', 'faceswap-result.jpg')">
                📥 結果画像をダウンロード
              </button>
            `;
          } else {
            resultsDiv.innerHTML = `
              <div class="status error">❌ 処理失敗</div>
              <div class="info">
                <strong>メッセージ:</strong> ${result.message}<br>
                <strong>エラー:</strong> ${result.error || 'なし'}
              </div>
            `;
          }
        } else {
          resultsDiv.innerHTML = `
            <div class="status error">❌ API エラー</div>
            <div class="info">
              <strong>ステータス:</strong> ${response.status}<br>
              <strong>エラー:</strong> ${data.error?.json?.message || 'Unknown error'}
            </div>
          `;
        }
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="status error">❌ エラーが発生しました</div>
          <div class="info">${error.message}</div>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    async function testVideoSwap() {
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('videoBtn');
      
      btn.disabled = true;
      resultsDiv.innerHTML = '<div class="status loading">⏳ 動画処理中（数秒かかる場合があります）...</div>';
      
      try {
        // ファイルを読み込む
        const sourceRes = await fetch('/upload/1000016980.jpg');
        const targetRes = await fetch('/upload/1000019517.mp4');
        
        const sourceBlob = await sourceRes.blob();
        const targetBlob = await targetRes.blob();
        
        const sourceBase64 = await blobToBase64(sourceBlob);
        const targetBase64 = await blobToBase64(targetBlob);
        
        const startTime = Date.now();
        
        // tRPC クライアントを使用
        const response = await fetch('/api/trpc/fileUpload.swapVideo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            "0": {
              "json": {
                "sourceImage": sourceBase64,
                "targetVideo": targetBase64,
                "quality": "medium"
              }
            }
          })
        });
        
        const data = await response.json();
        const processingTime = Date.now() - startTime;
        
        if (response.ok && data.result && data.result[0]?.data) {
          const result = data.result[0].data;
          
          if (result.success && result.resultVideo) {
            const resultUrl = `data:video/mp4;base64,${result.resultVideo}`;
            resultsDiv.innerHTML = `
              <div class="status success">✅ 動画処理成功！</div>
              <div class="info">
                <strong>処理時間:</strong> ${result.processingTime}ms<br>
                <strong>API 応答時間:</strong> ${processingTime}ms<br>
                <strong>結果動画サイズ:</strong> ${(result.resultVideo.length / 1024 / 1024).toFixed(2)}MB
              </div>
              <video src="${resultUrl}" controls class="result-video"></video>
              <button class="download-btn" onclick="downloadVideo('${resultUrl}', 'faceswap-result.mp4')">
                📥 結果動画をダウンロード
              </button>
            `;
          } else {
            resultsDiv.innerHTML = `
              <div class="status error">❌ 処理失敗</div>
              <div class="info">
                <strong>メッセージ:</strong> ${result.message}<br>
                <strong>エラー:</strong> ${result.error || 'なし'}
              </div>
            `;
          }
        } else {
          resultsDiv.innerHTML = `
            <div class="status error">❌ API エラー</div>
            <div class="info">
              <strong>ステータス:</strong> ${response.status}<br>
              <strong>エラー:</strong> ${data.error?.json?.message || 'Unknown error'}
            </div>
          `;
        }
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="status error">❌ エラーが発生しました</div>
          <div class="info">${error.message}</div>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function downloadImage(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
    }

    function downloadVideo(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
    }

    // ページ読み込み時にファイルを読み込む
    window.addEventListener('load', loadFiles);
  </script>
</body>
</html>
